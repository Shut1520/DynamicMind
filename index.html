<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DynamicMind — Carte de l'Afrique</title>
    <script>
      // Thème mémorisé, appliqué avant le premier affichage (pas de flash de la mauvaise couleur).
      try {
        const theme = localStorage.getItem('dynamicmind-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Stockage indisponible : le thème suit le système.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
